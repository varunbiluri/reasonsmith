e="animation-name:rs-cast-k3">declared scope: undeclared</text><text x="18" y="135.5" class="rs-cast-row rs-cast-out" xml:space="preserve" style="animation-name:rs-cast-k4">declared domains: consumer-credit</text><text x="18" y="153.5" class="rs-cast-row rs-cast-out" xml:space="preserve" style="animation-name:rs-cast-k5">pack: ecoa</text><text x="18" y="171.5" class="rs-cast-row rs-cast-out" xml:space="preserve" style="animation-name:rs-cast-k6">headline: 6 requirements · 6 binding: 3 observed, 1 violated, 1 not evaluated, 1 unattainable · all positives observed-only</text><text x="18" y="189.5" class="rs-cast-row rs-cast-elision" xml:space="preserve" style="animation-name:rs-cast-k7">⋯ 12 line(s) not shown</text><text x="18" y="207.5" class="rs-cast-row rs-cast-out" xml:space="preserve" style="animation-name:rs-cast-k8">[OBSERVED] ecoa_reg_b_1002_9_b_2_specific_reasons (ECOA / Regulation B (12 CFR 1002.9) 12 CFR 1002.9(b)(2)): satisfied</text><text x="18" y="225.5" class="rs-cast-row rs-cast-elision" xml:space="preserve" style="animation-name:rs-cast-k9">⋯ 5 line(s) not shown</text><text x="18" y="243.5" class="rs-cast-row rs-cast-out" xml:space="preserve" style="animation-name:rs-cast-k10">[PROBED] ecoa_reg_b_1002_9_b_2_principal_reasons_complete (ECOA / Regulation B (12 CFR 1002.9) 12 CFR 1002.9(b)(2)): violated</text><text x="18" y="261.5" class="rs-cast-row rs-cast-elision" xml:space="preserve" style="animation-name:rs-cast-k11">⋯ 5 line(s) not shown</text><text x="18" y="279.5" class="rs-cast-row rs-cast-out" xml:space="preserve" style="animation-name:rs-cast-k12">offending record: decision APP-1042 (step 1)</text><text x="18" y="297.5" class="rs-cast-row rs-cast-elision" xml:space="preserve" style="animation-name:rs-cast-k13">⋯ 14 line(s) not shown</text><text x="18" y="315.5" class="rs-cast-row rs-cast-exit" xml:space="preserve" style="animation-name:rs-cast-k14">[exit status 2]</text><text x="18" y="351.5" class="rs-cast-row rs-cast-prompt" xml:space="preserve" style="animation-name:rs-cast-k16">$ reasonsmith check --system-module reasonsmith.demo:deployed_credit_system --pack ecoa --system-name TruncatingCreditSystem --audience affected-individual</text><text x="18" y="369.5" class="rs-cast-row rs-cast-elision" xml:space="preserve" style="animation-name:rs-cast-k17">⋯ 10 line(s) not shown</text><text x="18" y="387.5" class="rs-cast-row rs-cast-out" xml:space="preserve" style="animation-name:rs-cast-k18">WHETHER THOSE WERE ALL THE REASONS</text><text x="18" y="405.5" class="rs-cast-row rs-cast-out" xml:space="preserve" style="animation-name:rs-cast-k19">4 further reason(s) the system&apos;s own answer depended on were not stated. Measured by re-running its inference, not inferred from its log:</text><text x="18" y="423.5" class="rs-cast-row rs-cast-out" xml:space="preserve" style="animation-name:rs-cast-k20">&quot;C05 — Insufficient number of credit references provided&quot;</text><text x="18" y="441.5" class="rs-cast-row rs-cast-out" xml:space="preserve" style="animation-name:rs-cast-k21">&quot;C03 — Delinquent past or present credit obligations&quot;</text><text x="18" y="459.5" class="rs-cast-row rs-cast-out" xml:space="preserve" style="animation-name:rs-cast-k22">&quot;C04 — Too many recent inquiries on credit bureau report&quot;</text><text x="18" y="477.5" class="rs-cast-row rs-cast-out" xml:space="preserve" style="animation-name:rs-cast-k23">&quot;C02 — Length of time credit has been established is too short&quot;</text><text x="18" y="495.5" class="rs-cast-row rs-cast-elision" xml:space="preserve" style="animation-name:rs-cast-k24">⋯ 15 line(s) not shown</text><text x="18" y="513.5" class="rs-cast-row rs-cast-exit" xml:space="preserve" style="animation-name:rs-cast-k25">[exit status 2]</text></svg>