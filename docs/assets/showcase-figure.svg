.rs-fig-vverdict{fill:var(--ok)}.rs-fig-v-bad rect{fill:var(--accent-soft);stroke:var(--accent-line)}.rs-fig-v-bad .rs-fig-vverdict{fill:var(--accent)}.rs-fig-vhead{fill:var(--muted);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.rs-fig-vverdict{font-size:15px;font-weight:700;letter-spacing:.04em}.rs-fig-vrung{fill:var(--muted);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.rs-fig-caption{fill:var(--ink);font-size:12.5px}.rs-fig-caption tspan.em{font-weight:700}</style><rect width="1203" height="506" x="0" y="0" class="rs-fig-bg"/><text x="26" y="46" class="rs-fig-title">One declined credit application, decision APP-1042</text><text x="26" y="70" class="rs-fig-sub">The reasons the adverse-action notice gave the applicant, beside the reasons the decision’s own inference used. reasonsmith re-ran that inference and switched each</text><text x="26" y="88" class="rs-fig-sub">reason off in turn: <tspan font-weight="700">4</tspan> of the 5 are reasons the system’s answer did not depend on. Nothing here was read from the decision log — the log records nothing missing.</text><rect width="564.4" height="240" x="26" y="116" class="rs-fig-panel" rx="7"/><path d="M26.0 123.0a7 7 0 0 1 7 -7h550.4a7 7 0 0 1 7 7v19.0h-564.4z" class="rs-fig-panel-head"/><text x="42" y="133.5" class="rs-fig-panel-title">WHAT THE APPLICANT WAS TOLD</text><text x="574.4" y="133.5" class="rs-fig-panel-count" text-anchor="end">1 of 5 reasons</text><rect width="564.4" height="240" x="612.4" y="116" class="rs-fig-panel" rx="7"/><path d="M612.4 123.0a7 7 0 0 1 7 -7h550.4a7 7 0 0 1 7 7v19.0h-564.4z" class="rs-fig-panel-head"/><text x="628.4" y="133.5" class="rs-fig-panel-title">WHAT THE DECISION ACTUALLY USED</text><text x="1160.8" y="133.5" class="rs-fig-panel-count" text-anchor="end">5 reasons, 4 struck</text><g class="rs-fig-chip rs-fig-live"><rect width="532.4" height="30" x="42" y="158" rx="5"/><text x="52" y="177.5" class="rs-fig-tag">stated</text><text x="120" y="177.5" class="rs-fig-label">C01 — Income insufficient for amount of credit requested</text></g><g class="rs-fig-chip rs-fig-live"><rect width="532.4" height="30" x="628.4" y="158" rx="5"/><text x="638.4" y="177.5" class="rs-fig-tag">stated</text><text x="706.4" y="177.5" class="rs-fig-label">C01 — Income insufficient for amount of credit requested</text></g><g class="rs-fig-chip rs-fig-gap"><rect width="532.4" height="30" x="42" y="196" rx="5"/><text x="52" y="215.5" class="rs-fig-tag">not stated</text></g><g class="rs-fig-chip rs-fig-del"><rect width="532.4" height="30" x="628.4" y="196" rx="5"/><text x="638.4" y="215.5" class="rs-fig-tag">deleted</text><text x="706.4" y="215.5" class="rs-fig-label">C05 — Insufficient number of credit references provided</text><line x1="698.4" x2="1109.5" y1="211" y2="211" class="rs-fig-strike"/></g><g class="rs-fig-chip rs-fig-gap"><rect width="532.4" height="30" x="42" y="234" rx="5"/><text x="52" y="253.5" class="rs-fig-tag">not stated</text></g><g class="rs-fig-chip rs-fig-del"><rect width="532.4" height="30" x="628.4" y="234" rx="5"/><text x="638.4" y="253.5" class="rs-fig-tag">deleted</text><text x="706.4" y="253.5" class="rs-fig-label">C03 — Delinquent past or present credit obligations</text><line x1="698.4" x2="1080.6" y1="249" y2="249" class="rs-fig-strike"/></g><g class="rs-fig-chip rs-fig-gap"><rect width="532.4" height="30" x="42" y="272" rx="5"/><text x="52" y="291.5" class="rs-fig-tag">not stated</text></g><g class="rs-fig-chip rs-fig-del"><rect width="532.4" height="30" x="628.4" y="272" rx="5"/><text x="638.4" y="291.5" class="rs-fig-tag">deleted</text><text x="706.4" y="291.5" class="rs-fig-label">C04 — Too many recent inquiries on credit bureau report</text><line x1="698.4" x2="1109.5" y1="287" y2="287" class="rs-fig-strike"/></g><g class="rs-fig-chip rs-fig-gap"><rect width="532.4" height="30" x="42" y="310" rx="5"/><text x="52" y="329.5" class="rs-fig-tag">not stated</text></g><g class="rs-fig-chip rs-fig-del"><rect width="532.4" height="30" x="628.4" y="310" rx="5"/><text x="638.4" y="329.5" class="rs-fig-tag">deleted</text><text x="706.4" y="329.5" class="rs-fig-label">C02 — Length of time credit has been established is too short</text><line x1="698.4" x2="1150.8" y1="325" y2="325" class="rs-fig-strike"/></g><g class="rs-fig-verdict rs-fig-v-ok"><rect width="564.4" height="62" x="26" y="382" rx="6"/><text x="40" y="405" class="rs-fig-vhead">the notice’s form · ecoa_reg_b_1002_9_b_2_specific_reasons</text><text x="40" y="428" class="rs-fig-vverdict">✓ SATISFIED</text><text x="576.4" y="428" class="rs-fig-vrung" text-anchor="end">evidence: observed</text></g><g class="rs-fig-verdict rs-fig-v-bad"><rect width="564.4" height="62" x="612.4" y="382" rx="6"/><text x="626.4" y="405" class="rs-fig-vhead">the notice’s content · ecoa_reg_b_1002_9_b_2_principal_reasons_complete</text><text x="626.4" y="428" class="rs-fig-vverdict">✗ VIOLATED</text><text x="1162.8" y="428" class="rs-fig-vrung" text-anchor="end">evidence: probed</text></g><text x="26" y="470" class="rs-fig-caption"><tspan class="em">Both duties are 12 CFR 1002.9(b)(2), on this same decision.</tspan> A checker that reads the notice’s form alone reports it compliant — and launders that gap into a document that reads as authoritative.</text></svg>